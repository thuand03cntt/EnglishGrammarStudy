{% extends "base.html" %}

{% block title %}Đăng nhập - EnglishPractice{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle text-primary" style="font-size: 3.5rem;"></i>
                        <h3 class="fw-bold mt-2">Đăng Nhập</h3>
                        <p class="text-secondary small">Nhập tên đăng nhập hoặc email của bạn</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                        <div class="mb-3">
                            <label for="identifier" class="form-label fw-semibold">Tên đăng nhập hoặc Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="identifier" name="identifier" 
                                       placeholder="admin hoặc email@domain.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none">Quên mật khẩu?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Nhập mật khẩu" required>
                            </div>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1">
                            <label class="form-check-label small text-secondary" for="remember">Ghi nhớ đăng nhập trên thiết bị này</label>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập
                            </button>
                        </div>

                        <div class="text-center">
                            <span class="text-secondary small">Chưa có tài khoản?</span>
                            <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-decoration-none ms-1">Đăng ký ngay</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Demo Hint Box -->
            <div class="card mt-3 bg-light border-0 shadow-sm">
                <div class="card-body py-2 px-3 small text-secondary">
                    <i class="bi bi-info-circle text-primary me-1"></i>
                    <strong>Tài khoản Quản trị viên mặc định:</strong>
                    <code>admin</code> / <code>123456a@</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

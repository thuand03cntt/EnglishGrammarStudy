{% extends "base.html" %}

{% block title %}Đặt lại mật khẩu - EnglishPractice{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill text-success" style="font-size: 3.5rem;"></i>
                        <h3 class="fw-bold mt-2">Tạo Mật Khẩu Mới</h3>
                        <p class="text-secondary small">Vui lòng nhập mật khẩu mới cho tài khoản của bạn</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Tối thiểu 6 ký tự" minlength="6" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                       placeholder="Nhập lại mật khẩu mới" minlength="6" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-success btn-lg fw-semibold">
                                <i class="bi bi-check2-circle me-2"></i> Lưu Mật Khẩu Mới
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
